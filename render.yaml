services:
  - type: web
    name: johngpt
    runtime: docker
    plan: free
    region: oregon
    dockerfilePath: ./Dockerfile
    disk:
      name: johngpt-data
      mountPath: /app/data
      sizeGB: 1
    envVars:
      - key: GEMINI_API_KEY
        sync: false
      - key: GEMINI_MODEL
        value: gemini-3.5-flash-lite
      - key: DATA_DIR
        value: /app/data

